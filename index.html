<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pharell Jay Jeyakumar</title>
  <meta name="description" content="Pharell Jay Jeyakumar, Software Engineering student at Hochschule Heilbronn. Projects and scientific work.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- All text content is rendered from data.js by script.js -->
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#top" class="brand" id="brand"></a>
      <nav aria-label="Sections" id="nav">
        <a href="#projects">Projects</a>
        <a href="#research">Scientific work</a>
        <a href="#about">About</a>
        <a href="#stack">Stack</a>
        <a href="#education">Education</a>
        <a href="#contact">Contact</a>
      </nav>
      <ul class="topbar-socials">
        <li><a class="chip chip-sm" data-profile="github" target="_blank" rel="noopener">GitHub</a></li>
        <li><a class="chip chip-sm" data-profile="linkedin" target="_blank" rel="noopener">LinkedIn</a></li>
        <li><a class="chip chip-sm" data-profile="email">Email</a></li>
        <li><a class="chip chip-sm" data-profile="discord" data-show-value target="_blank" rel="noopener">Discord</a></li>
      </ul>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="wrap hero-inner">
        <div class="hero-main">
          <h1 id="name"></h1>
          <p class="tagline" id="tagline"></p>
          <p class="intro" id="intro"></p>
          <!-- Links come from PROFILE in data.js; icons are added by script.js -->
          <ul class="chips">
            <li><a class="chip" data-profile="github" target="_blank" rel="noopener">GitHub</a></li>
            <li><a class="chip" data-profile="linkedin" target="_blank" rel="noopener">LinkedIn</a></li>
            <li><a class="chip" data-profile="email">Email</a></li>
            <li><a class="chip" data-profile="discord" data-show-value target="_blank" rel="noopener">Discord</a></li>
          </ul>
        </div>
        <!-- Photo and facts come from PROFILE.photo and ABOUT.facts -->
        <aside class="card profile-card" id="profile-card"></aside>
      </div>
    </section>

    <section class="section" id="projects">
      <div class="wrap section-inner">
        <div class="section-head"><h2>Projects</h2><p class="section-meta" id="projects-meta"></p></div>
        <div class="grid" id="projects-list"></div>
      </div>
    </section>

    <section class="section" id="research">
      <div class="wrap section-inner">
        <div class="section-head"><h2>Scientific work</h2><p class="section-meta" id="papers-meta"></p></div>
        <div class="stack-list" id="papers-list"></div>
      </div>
    </section>

    <section class="section" id="about">
      <div class="wrap section-inner">
        <div class="section-head"><h2>About</h2></div>
        <div class="about-text" id="about-body"></div>
      </div>
    </section>

    <section class="section" id="stack">
      <div class="wrap section-inner">
        <div class="section-head"><h2>Stack</h2></div>
        <dl class="card rows" id="stack-list"></dl>
      </div>
    </section>

    <section class="section" id="education">
      <div class="wrap section-inner">
        <div class="section-head"><h2>Education</h2></div>
        <div class="stack-list" id="education-list"></div>
      </div>
    </section>

    <section class="section contact" id="contact">
      <div class="wrap section-inner">
        <div class="section-head"><h2>Contact</h2></div>
        <div>
          <p class="contact-text" id="contact-text"></p>
          <ul class="chips">
            <li><a class="chip" data-profile="email" data-show-value>Email</a></li>
            <li><a class="chip" data-profile="discord" data-show-value target="_blank" rel="noopener">Discord</a></li>
            <li><a class="chip" data-profile="linkedin" target="_blank" rel="noopener">LinkedIn</a></li>
            <li><a class="chip" data-profile="github" target="_blank" rel="noopener">GitHub</a></li>
          </ul>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer-inner">
      <p>© <span id="year"></span> <span id="footer-name"></span></p>
      <a href="#top">Back to top</a>
    </div>
  </footer>

  <!-- PDF viewer -->
  <dialog class="pdf-dialog" id="pdf-dialog" aria-labelledby="pdf-title">
    <div class="pdf-header">
      <p id="pdf-title"></p>
      <div class="pdf-actions">
        <a class="btn" id="pdf-open" target="_blank" rel="noopener">Open in new tab</a>
        <button type="button" class="btn" id="pdf-close">Close</button>
      </div>
    </div>
    <iframe id="pdf-frame" title="PDF document"></iframe>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
